name: Feature request
description: An idea for a component, a prop, an output format or the docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The deck, document or report you have in mind, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: A sketch of the spec or the props helps. Say whether it should work in PowerPoint, Word, or both.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've tried

name: Size

# Comments on each pull request with how every package's size changes against main, for its
# own code and with its document engine (budgets in each package's .size-limit.json).
# size-limit-action installs with npm, which can't resolve bun's workspace: protocol,
# so both builds are measured here with bun.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Measure the pull request
        run: |
          bun install --frozen-lockfile
          bun run build
          for dir in packages/*/; do
            (cd "$dir" && bunx size-limit --json > "$RUNNER_TEMP/head-$(basename "$dir").json") || true
          done
      - name: Measure main
        run: |
          git checkout --force "origin/$GITHUB_BASE_REF"
          bun install --frozen-lockfile
          bun run build || true
          for dir in packages/*/; do
            (cd "$dir" && bunx size-limit --json > "$RUNNER_TEMP/base-$(basename "$dir").json") || true
          done
      - name: Write the report
        id: report
        run: |
          node - "$RUNNER_TEMP" > "$RUNNER_TEMP/size.md" <<'EOF'
          const fs = require('node:fs')
          const dir = process.argv[2]
          const read = (label, name) => {
            try {
              return JSON.parse(fs.readFileSync(`${dir}/${label}-${name}.json`, 'utf8'))
            } catch {
              return []
            }
          }
          const names = fs.readdirSync('packages')
          const kb = (bytes) => `${(bytes / 1000).toFixed(2)} kB`
          const rows = names.flatMap((name) =>
            read('head', name).map(({ name: entry, size, sizeLimit, passed }) => {
              const before = read('base', name).find((e) => e.name === entry)?.size
              const diff = before === undefined ? 'new' : `${size >= before ? '+' : ''}${(((size - before) / before) * 100).toFixed(2)}%`
              return `| ${passed ? '' : '❌ '}${name} | ${entry} | ${kb(size)} | ${diff} | ${kb(sizeLimit)} |`
            }),
          )
          if (rows.length === 0) throw new Error('size-limit produced no results for the pull request')
          console.log(['## size-limit report', '', '| Package | Entry | Size | Change | Limit |', '| --- | --- | --- | --- | --- |', ...rows].join('\n'))
          EOF
          cat "$RUNNER_TEMP/size.md" >> "$GITHUB_STEP_SUMMARY"
          if grep -q '❌' "$RUNNER_TEMP/size.md"; then echo "Over the size budget" >&2; exit 1; fi
      # Pull requests from forks and from Dependabot get a read-only token, so they only
      # get the job summary above.
      - name: Comment on the pull request
        if: ${{ !cancelled() && steps.report.conclusion != 'skipped' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: test -s "$RUNNER_TEMP/size.md" && gh pr comment "$PR" --edit-last --create-if-none --body-file "$RUNNER_TEMP/size.md"

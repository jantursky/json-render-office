name: Release

# Pushing a version tag, `1.1.0` or `v1.1.0`, creates the GitHub release from the CHANGELOG
# sections of the four packages, then runs every check and publishes the packages to npm with
# provenance, in dependency order. The two jobs are independent: a failed publish still leaves
# the GitHub release. Run it by hand with a tag to release a tag pushed earlier.
#
# The packages share one version. Each one needs a trusted publisher on npmjs.com that names
# this repository, the workflow file `release.yml` and the environment `npm`.
on:
  push:
    tags: ['[0-9]*', 'v[0-9]*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, such as 1.0.0
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # In publish order: the renderers depend on json-render-office, the report on all three.
  PACKAGES: json-render-office json-render-pptx json-render-docx json-render-report

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: Tag matches every package version
        run: |
          for name in $PACKAGES; do
            version=$(node -p "require('./packages/$name/package.json').version")
            test "${TAG#v}" = "$version" || { echo "Tag $TAG does not match $name@$version" >&2; exit 1; }
          done
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          : > notes.md
          for name in $PACKAGES; do
            awk -v v="${TAG#v}" '
              $0 ~ "^## \\[" v "\\]" { found = 1; next }
              found && /^## \[/ { exit }
              found && /^\[.*\]: / { exit }
              found { print }
            ' "packages/$name/CHANGELOG.md" > section.md
            if [ -s section.md ]; then
              { echo "### $name"; cat section.md; echo; } >> notes.md
            fi
          done
          if [ ! -s notes.md ]; then
            echo "No CHANGELOG has a section for ${TAG#v}" >&2
            exit 1
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md

  npm:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing and provenance use the workflow's OIDC token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer.
      - run: npm install -g npm@11
      - name: Tag matches every package version
        run: |
          for name in $PACKAGES; do
            version=$(node -p "require('./packages/$name/package.json').version")
            test "${TAG#v}" = "$version" || { echo "Tag $TAG does not match $name@$version" >&2; exit 1; }
          done
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      # Type-aware lint resolves the workspace packages through their built types.
      - run: bun run build
      - run: bun run check
      - run: bun run size
      - run: bun run lint:package
      - run: bun run test:pack
      - run: bun run test:e2e
      - name: Publish to npm
        run: |
          version="${TAG#v}"
          for name in $PACKAGES; do
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            # The checks above already ran; prepublishOnly would repeat them.
            (cd "packages/$name" && npm publish --provenance --access public --ignore-scripts)
          done
